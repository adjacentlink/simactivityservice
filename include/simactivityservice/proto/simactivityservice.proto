// Transmission Protocol
//
// ...


syntax = "proto2";

package SimActivityService;

option optimize_for = SPEED;

message Activity
{
  enum Type
  {
    TYPE_ACTIVITY_HELLO = 1;
    TYPE_ACTIVITY_TIME_NOTICE = 2;
    TYPE_ACTIVITY_TIME_CONFIRM_NOTICE = 3;
    TYPE_ACTIVITY_TIME_NOW = 4;
    TYPE_ACTIVITY_TIME_CONFIRM_NOW = 5;
    TYPE_ACTIVITY_TIME_SIGNAL= 6;
    TYPE_ACTIVITY_STATUS = 7;
    TYPE_ACTIVITY_ACTION = 8;
  }

  message TimeNotice
  {
    required uint64 time_microseconds_since_epoch = 1;
  }

  message TimeConfirmNotice
  {
    required uint64 time_microseconds_since_epoch = 1;
    required bool ready = 2;
    required uint64 reference_sequence_number = 5;
  }

  message TimeNow
  {
    required uint64 time_microseconds_since_epoch = 1;
  }

  message TimeConfirmNow
  {
    required uint64 time_microseconds_since_epoch = 1;
    required bool ready = 2;
    required uint64 reference_sequence_number = 5;
  }
  
  message Action
  {
    required string name = 1;
    required string unique_identifier = 2;
  }

  message Status
  {
    required uint64 next_time_microseconds_since_epoch = 1;
  }

  required Type type = 1;
  required bytes uuid = 2;
  required string tag = 3;
  required uint64 time_microseconds_since_epoch = 4;
  required uint64 sequence_number = 5;
  optional TimeNotice time_notice = 6;
  optional TimeConfirmNotice time_confirm_notice = 7;
  optional TimeNow time_now = 8;
  optional TimeConfirmNow time_confirm_now = 9;
  optional Status status = 10;
  optional Action action = 11;
}
